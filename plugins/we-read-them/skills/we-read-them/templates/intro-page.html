<script>
// Reel 0 (vertical): Hailey Dunn series intro. The polygraph, the county, the charge and the dismissal, the internet, the file. 1080x1920.

function tw(s, o = {}) { x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; const w = x.measureText(s).width; x.restore(); return w; }

const word = (i, w) => (T(i).words.find(x => x[0].replace(/[.,?]/g, '').toLowerCase() === w) || [0, T(i).t0])[1];

// the polygraph: three pen traces scrolling on chart paper; at "refused" the pens go flat
function poly(t) { const X = 60, Y = 360, w = 960, h = 700; fill(X, Y, w, h, C.paper); grain(X, Y, w, h, .1);

// West Texas schematic: Mitchell and Scurry counties (north is up), real lat/long for the pins
const MB = [140, 330, 800, 1060, -101.30, -100.55, 32.02, 33.02];

  txt('MITCHELL CO.', mx1 - 20, my1 - 26, { s: 30, f: F.mono, w: 600, c: C.dim, al: 'right', id: 'mc' }); txt('SCURRY CO.', mx1 - 20, sy0 + 50, { s: 30, f: F.mono, w: 600, c: kS > .5 ? C.acc : C.dim, al: 'right', id: 'sc' });
  const cc = proj(-100.864, 32.388), sn = proj(-100.917, 32.718), lk = proj(-101.13, 32.60);

function photo(img, X, Y, w, h, k, fy = .4) { const z = lerp(1.0, 1.12, k), s = Math.max(w / img.width, h / img.height) * z, dw = img.width * s, dh = img.height * s;
