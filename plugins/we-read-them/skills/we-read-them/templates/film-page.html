<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>What the record says: Gabby Petito</title>
<style>

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// What the record says: Gabby Petito. Visual Investigation style, Canvas 2D, drawn deterministically by window.render(t).
// All timing lives in film.json (shared with the mix and the subtitles).
const W = 1920, H = 1080;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const C = { bg:'#0B0C0E', panel:'#141619', line:'#2E3238', text:'#ECEAE4', dim:'#8B9097', faint:'#4A4F57', acc:'#FF4A2E', paper:'#E4E0D4', ink:'#1D1D1B' };
const F = { sans:'Sans', mono:'Mono', it:'SerifI' };
let FILM = null, SEC = {}, FR = 0, REC = null, TN = 0;
// time warp: film (new) time <-> drawing (old) time, from film.json
function wold(t) { const W = FILM.warp; for (let i = 1; i < W.length; i++) if (t <= W[i][0]) return W[i - 1][1] + (t - W[i - 1][0]) * (W[i][1] - W[i - 1][1]) / Math.max(1e-6, W[i][0] - W[i - 1][0]); return W[W.length - 1][1] + t - W[W.length - 1][0]; }
function wnew(o) { const W = FILM.warp; for (let i = 1; i < W.length; i++) if (o <= W[i][1]) return W[i - 1][0] + (o - W[i - 1][1]) * (W[i][0] - W[i - 1][0]) / Math.max(1e-6, W[i][1] - W[i - 1][1]); return W[W.length - 1][0] + o - W[W.length - 1][1]; }

// ── Utilities ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const inS = (t, k) => t >= SEC[k][0] && t < SEC[k][1];
const S0 = k => SEC[k][0];

// ── Assets ──
const IM = {}, SEQ = {}, WAVE = {}; let GRAIN = [];
const NFR = { van: 330, chief: 61, taylor: 166, moab: 135, father: 223 };
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); SEC = FILM.sections; window.DUR = FILM.dur;
  for (const c of ['chief', 'taylor', 'moab', 'father']) WAVE[c] = await (await fetch(`assets/snd/${c}.json`)).json();
  const L = [];
  for (const [k, s] of Object.entries({ p81: 'assets/fbi_p81.png', p292: 'assets/fbi_p292.png', p28: 'assets/fbi5_p28.png' })) L.push(load(s).then(i => IM[k] = i));
  for (const [d, n] of Object.entries(NFR)) { SEQ[d] = []; for (let i = 1; i <= n; i++) L.push(load(`assets/${d}/${String(i).padStart(3, '0')}.jpg`).then(im => SEQ[d][i - 1] = im)); }
  for (const f of ['700 40px Sans', '400 20px Sans', '400 20px Mono', '600 20px Mono', 'italic 24px SerifI']) L.push(document.fonts.load(f));
  await Promise.all(L);
  for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 99 + 7);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  window.READY = true;
}

// ── Drawing primitives ──
function txt(s, X, Y, o = {}) {
  x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  if (x.globalAlpha > 0.001) x.fillText(s, X, Y);
  const w = x.measureText(s).width; const ga = x.globalAlpha; x.restore();
  if (REC && o.id && ga > 0.5) { const sz = o.s || 24, x0 = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X;
    REC.push({ id: o.id, text: s, x0, y0: Y - sz * .9, x1: x0 + w, y1: Y + sz * .25 }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
function wrap(s, maxW, o) { const toks = s.split(/(?<= )/); const out = []; let line = '';
  for (const tk of toks) { if (tw(line + tk, o) > maxW && line) { out.push(line.trimEnd()); line = tk.trimStart(); } else line += tk; } if (line) out.push(line); return out; }
function para(s, X, Y, maxW, lh, o) { const ls = wrap(s, maxW, o); ls.forEach((l, i) => txt(l, X, Y + i * lh, { ...o, id: o.id ? o.id + i : undefined })); return ls.length; }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function rect(X, Y, w, h, c = C.line, lw = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function ring(cx, cy, r, k, label, side = 1, id) {
  if (k <= 0) return; x.save(); x.strokeStyle = C.acc; x.lineWidth = 2.5;
  x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore();
  if (label && k > .6) { const a = seg(k, .6, .75); const lx = cx + side * (r * .72), ly = cy - r * .72, ex = lx + side * 40, ey = ly - 30;
    x.save(); x.globalAlpha *= a; hair(lx, ly, ex, ey, C.acc, 1.5); hair(ex, ey, ex + side * 14, ey, C.acc, 1.5); x.restore();
    txt(label, ex + side * 20, ey + 7, { s: 22, w: 700, al: side > 0 ? 'left' : 'right', a, id }); }
}
function plate(img, sx, sy, sw, sh, X, Y, w, h, o = {}) {
  x.save(); x.globalAlpha *= (o.a ?? 1); fill(X, Y, w, h, '#000');
  if (img) { x.filter = o.doc ? 'grayscale(1) contrast(1.05) brightness(0.86)' : 'grayscale(1) contrast(1.22) brightness(0.94)';
    x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.filter = 'none'; }
  if (GRAIN.length) { x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha *= o.doc ? .10 : .22;
    const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); }
  x.restore();
  if (!o.noborder) rect(X, Y, w, h, o.border || C.line, o.bw || 1);
}
// fill a panel without stretching; returns source-fraction -> screen mapping
function cover(img, X, Y, w, h, o = {}, fx = .5, fy = .5, z = 1) {
  if (!img) { plate(null, 0, 0, 1, 1, X, Y, w, h, o); return () => [X, Y]; }
  const iw = img.width, ih = img.height; let sw = iw, sh = iw * h / w; if (sh > ih) { sh = ih; sw = ih * w / h; }
  sw /= z; sh /= z; const sx = clamp((iw * fx) - sw / 2, 0, iw - sw), sy = clamp((ih * fy) - sh / 2, 0, ih - sh);
  plate(img, sx, sy, sw, sh, X, Y, w, h, o); const k = w / sw;
  return (u, v) => [X + (u * iw - sx) * k, Y + (v * ih - sy) * k];
}
function tag(s, X, Y, o = {}) { const w = txt(s, X + 14, Y, { s: o.s || 17, f: F.mono, c: o.c || C.dim, w: 600, ls: .5, a: o.a ?? 1, id: o.id });
  x.save(); x.globalAlpha *= o.a ?? 1; fill(X, Y - 12, 6, 13, o.chip || C.acc); x.restore(); return w; }
function flash(t, at, X, Y, w, h, d = .12) { if (t < at) return; const k = 1 - seg(t, at, at + d); if (k <= 0) return; x.save(); x.globalAlpha = k * .9; fill(X, Y, w, h, '#fff'); x.restore(); }
function badge(X, Y, t, at) { const k = seg(t, at, at + .06); if (k <= 0) return; x.save(); x.globalAlpha *= k; x.translate(X, Y);
  x.fillStyle = 'rgba(11,12,14,0.85)'; x.fillRect(-15, -15, 30, 30); x.strokeStyle = C.acc; x.lineWidth = 2; x.strokeRect(-15, -15, 30, 30);
  x.beginPath(); x.moveTo(-8, 0); x.lineTo(-2, 7); x.lineTo(9, -7); x.lineWidth = 3; x.stroke(); x.restore(); }
function wave(c, X, Y, w, h, k) { const pk = WAVE[c].pk, n = pk.length, bw = w / n;
  for (let i = 0; i < n; i++) { const v = Math.max(.04, pk[i]) * h / 2; x.fillStyle = i / n < k ? C.text : C.faint; x.fillRect(X + i * bw, Y - v, Math.max(1, bw - 1), v * 2); }
  if (k > 0 && k < 1) hair(X + w * k, Y - h / 2 - 6, X + w * k, Y + h / 2 + 6, C.acc, 2); }
// a news clip frame at film time t (plays from clip start, then holds the last frame)
function clipImg(name, t) { if (name === 'van') { const [n0] = FILM.clips_new.van; const tn = Math.min(TN, wnew(47.5) + FILM.intro); return SEQ.van[clamp(Math.floor((tn - n0) * 30), 0, NFR.van - 1)]; }
  const [t0] = FILM.clips[name]; const n = NFR[name]; const i = clamp(Math.floor((t - t0) * 30), 0, n - 1); return SEQ[name][i]; }
function clipK(name, t) { const [t0, d] = FILM.clips[name]; return seg(t, t0, t0 + d); }
// lower third: red bar + name + one mono line
function lower(name, line, X, Y, a = 1) { x.save(); x.globalAlpha *= a; fill(X, Y - 34, 6, 46, C.acc); x.restore();
  txt(name, X + 20, Y - 6, { s: 32, w: 700, a, id: 'lt' + name }); txt(line, X + 20, Y + 22, { s: 17, f: F.mono, c: C.dim, a }); }
// paper card for typeset transcriptions; quote in serif italic with a wiped red highlight on `hi`
function paper(X, Y, w, h, lines, o = {}) {
  fill(X, Y, w, h, C.paper); x.save(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .10; x.beginPath(); x.rect(X, Y, w, h); x.clip();
  const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); x.restore();
  let yy = Y + (o.pad || 54);
  for (const L of lines) {
    const s = L.s || 30, f = L.f || F.it, it = !!L.it || f === F.it, lh = L.lh || s * 1.38;
    const ls = wrap(L.t, w - 2 * (o.padx || 48), { s, f, it, w: L.w || 400 });
    for (const ln of ls) {
      if (L.hi && L.hk > 0) { const ww = tw(ln, { s, f, it, w: L.w || 400 }); x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = .6; fill(X + (o.padx || 48) - 4, yy - s * .9, (ww + 8) * eo(L.hk), s * 1.18, C.acc); x.restore(); }
      txt(ln, X + (o.padx || 48), yy, { s, f, it, w: L.w || 400, c: L.c || C.ink, id: L.id ? L.id + ln.slice(0, 6) : undefined }); yy += lh; }
    yy += L.gap || 10;
  }
}

// ── Claim card: the number, the claim people repeat, a red strike-through at `strike` ──
function claim(t, sec, n, s, strike, o = {}) {
  const t0 = S0(sec); const a = seg(t, t0, t0 + .08);
  const X = 60, Y = o.y || 150;
  txt(String(n), X, Y + 30, { s: 124, w: 700, f: F.mono, c: C.acc, a });
  const cx = X + 200, sz = o.s || 46;
  const ls = wrap(s, o.w || 1500, { s: sz, w: 700 });
  ls.forEach((l, i) => txt(l, cx, Y - 20 + i * sz * 1.25, { s: sz, w: 700, c: t >= strike ? C.dim : C.text, a, id: 'claim' + n + i }));
  if (t >= strike) { const k = eo(seg(t, strike, strike + .35)); ls.forEach((l, i) => { const ww = tw(l, { s: sz, w: 700 }); const yy = Y - 20 + i * sz * 1.25 - sz * .32; hair(cx - 6, yy, cx - 6 + (ww + 12) * k, yy, C.acc, 4); }); }
}

// ── Map: schematic lon/lat projection of the western/southern U.S. (no borders; schematic) ──
function proj(lon, lat, B) { const [x0, y0, w, h, lo0, lo1, la0, la1] = B; const kx = Math.cos(37 * Math.PI / 180);
  return [x0 + (lon - lo0) / (lo1 - lo0) * w, y0 + (la1 - lat) / (la1 - la0) * h]; }
function graticule(B, a = 1) { const [x0, y0, w, h, lo0, lo1, la0, la1] = B; x.save(); x.globalAlpha *= a * .7;
  for (let lo = Math.ceil(lo0 / 5) * 5; lo <= lo1; lo += 5) { const [px] = proj(lo, 0, B); hair(px, y0, px, y0 + h, '#1c1f23'); }
  for (let la = Math.ceil(la0 / 5) * 5; la <= la1; la += 5) { const [, py] = proj(0, la, B); hair(x0, py, x0 + w, py, '#1c1f23'); }
  x.restore(); rect(x0, y0, w, h, C.line); }
function pin(px, py, label, o = {}) { const a = o.a ?? 1; x.save(); x.globalAlpha *= a;
  if (o.ghost) { x.setLineDash([5, 5]); x.strokeStyle = C.faint; x.lineWidth = 2; x.beginPath(); x.arc(px, py, 11, 0, 7); x.stroke(); }
  else { x.fillStyle = o.c || C.acc; x.beginPath(); x.arc(px, py, 8, 0, 7); x.fill(); }
  x.restore(); if (label) txt(label, px + (o.al === 'right' ? -20 : 20), py + 8, { s: o.s || 24, w: 700, c: o.ghost ? C.dim : C.text, a, al: o.al || 'left', id: 'pin' + label });
  if (o.sub) txt(o.sub, px + (o.al === 'right' ? -20 : 20), py + 34, { s: 16, f: F.mono, c: C.dim, a, al: o.al || 'left' }); }

// ── Subtitles: one line, bottom ──
function subs(t) { for (const [a, b, s] of FILM.subs) if (t >= a && t < b) {
  x.save(); x.font = `700 31px ${F.sans}`; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = 10; x.fillStyle = C.text;
  x.fillText(s, W / 2, 1012); x.restore(); } }
window.SUBCHECK = () => FILM.subs.map(([a, b, s], i) => { const w = tw(s, { s: 31, w: 700 }); return { i, w, ok: w <= 1600, s }; });

// ═══════════ Scenes ═══════════
const D = (lon, lat) => [lon, lat];
const PL = { yos: D(-119.59, 37.75), spread: D(-110.57, 43.77), gnv: D(-82.33, 29.65), np: D(-82.24, 27.04), moab: D(-109.55, 38.57) };

function sCold(t) {
  // phone bubble types on
  const X = 150, Y = 330; const k = seg(t, .4, 1.5); const s = 'No service in Yosemite';
  if (t >= .25) { tag('Text from Gabby’s phone · Aug. 30, 2021', X, Y - 30, { a: seg(t, .25, .35) });
    x.save(); x.fillStyle = '#2A2D32'; x.beginPath(); x.roundRect(X, Y, 640, 110, 30); x.fill(); x.restore();
    const n = Math.floor(s.length * k); txt(s.slice(0, n), X + 38, Y + 70, { s: 44, w: 400 });
    if (k >= 1) txt(s, X + 38, Y + 70, { s: 44, w: 400, a: 0, id: 'bubble' });
    if (k < 1 && Math.floor(t * 4) % 2 === 0) fill(X + 38 + tw(s.slice(0, n), { s: 44 }), Y + 36, 3, 44, C.text); }
  // map: where the phone said vs. where she was
  if (t >= 2.2) { const B = [900, 120, 900, 700, -124, -100, 33, 47]; flash(t, 2.2, 900, 120, 900, 700);
    graticule(B); tag('Schematic · straight-line distance', 900, 104, {});
    const [ax, ay] = proj(...PL.yos, B), [bx, by] = proj(...PL.spread, B);
    pin(ax, ay, 'Yosemite, Calif.', { ghost: true, sub: 'what the text said' });
    pin(bx, by, 'Spread Creek, Wyo.', { a: seg(t, 3.0, 3.1), sub: 'where she was', al: 'right' });
    if (t > 3.6) { const k2 = eo(seg(t, 3.6, 4.4)); hair(ax, ay, lerp(ax, bx, k2), lerp(ay, by, k2), C.acc, 2, [8, 6]);
      if (k2 >= 1) txt('≈ 630 mi', (ax + bx) / 2 + 20, (ay + by) / 2 + 40, { s: 34, w: 700, f: F.mono, id: 'dist' }); }
  }
}

function sTitle(t) { const t0 = S0('title');
  txt('The file', 60, 300, { s: 104, w: 700, a: seg(t, t0, t0 + .06), id: 'title' });
  txt('FBI Vault \u00b7 case 70A-DN-3494764', 64, 372, { s: 30, f: F.mono, c: C.dim, a: seg(t, t0 + .3, t0 + .4), id: 'sub' });
  const parts = [['Part 01', '366 pp'], ['Part 02', '201 pp'], ['Part 03', '245 pp'], ['Part 04', '52 pp'], ['Part 05', '166 pp'], ['Part 06', 'final']];
  parts.forEach(([p, n], i) => { const at = t0 + 3.4 + i * .22; if (t < at) return; const Y = 170 + i * 92;
    fill(1180, Y, 680, 70, C.panel); rect(1180, Y, 680, 70); flash(t, at, 1180, Y, 680, 70);
    txt('FBI Vault · Brian Laundrie · ' + p, 1206, Y + 45, { s: 22, f: F.mono, w: 600 }); txt(n, 1834, Y + 45, { s: 22, f: F.mono, c: C.dim, al: 'right' }); });
  if (t >= t0 + 3.4) txt('1,000+ pages', 60, 640, { s: 120, w: 700, f: F.mono, c: C.acc, a: seg(t, t0 + 3.4, t0 + 3.5), id: 'pages' });
  if (t >= t0 + 4.4) txt('10 things the record says', 66, 720, { s: 36, w: 700, a: seg(t, t0 + 4.4, t0 + 4.5), id: 'ten' });
}

function s10(t) { const t0 = S0('s10');
  claim(t, 's10', 10, '“He was charged with her murder.”', 18.2);
  if (t >= 18.6 && t < 24.3) { flash(t, 18.6, 60, 330, 760, 360);
    paper(60, 330, 760, 360, [{ t: 'United States v. Brian Christopher Laundrie', f: F.sans, w: 700, s: 26, it: false },
      { t: 'D. Wyoming · warrant issued Sept. 22, 2021', f: F.mono, s: 19, it: false, c: '#555' },
      { t: 'One count: 18 U.S.C. § 1029(a)(2), unauthorized use of an access device (her debit card), $1,000 or more.', s: 30, hi: 1, hk: seg(t, 19.0, 19.8), gap: 20 },
      { t: 'Transcription, summary of the charge', f: F.mono, s: 16, it: false, c: '#666' }]);
    tag('Court record', 60, 316); }
  if (t >= 21.2) { const B = [880, 300, 980, 560, -116, -78, 25, 47]; const a = 1;
    if (t < 24.3) { graticule(B); tag('Schematic · the drive home, Aug. 30–Sept. 1', 880, 284);
      const [ax, ay] = proj(...PL.spread, B), [bx, by] = proj(...PL.gnv, B), [cx, cy] = proj(...PL.np, B);
      pin(ax, ay, 'Wyoming', { sub: 'Aug. 30' }); const k = eo(seg(t, 21.3, 22.0));
      hair(ax, ay, lerp(ax, bx, k), lerp(ay, by, k), C.acc, 2, [8, 6]);
      if (k >= 1) { pin(bx, by, 'Gainesville', { sub: 'Sept. 1', al: 'right' }); pin(cx, cy, 'North Port', { c: C.text, al: 'right' }); } } }
  if (t >= 24.3) { flash(t, 24.3, 60, 300, 1800, 600);
    const z = lerp(1.0, 1.15, eio(seg(t, 24.3, 29.5)));
    const m = cover(IM.p81, 60, 300, 1100, 600, { doc: 1 }, .5, .42, z);
    tag('FBI FD-302 · Vault part 01, p. 81', 60, 284);
    // highlight the card amount and the pump time lines
    const hl = (u0, v, u1, at) => { const [a0, b0] = m(u0, v - .009), [a1, b1] = m(u1, v + .009); const k = eo(seg(t, at, at + .5));
